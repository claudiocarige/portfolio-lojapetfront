<div class="page-container">
  <mat-card class="create-cliente-page">
    <mat-card-title>Criar Cliente</mat-card-title>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="row">
          <mat-form-field appearance="fill">
            <mat-label>Tipo</mat-label>
            <mat-select formControlName="tipo">
              <mat-option value="PJ">Pessoa Jurídica (PJ)</mat-option>
              <mat-option value="PF">Pessoa Física (PF)</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="fill" class="full">
            <mat-label>Nome do cliente</mat-label>
            <input matInput formControlName="nomeCliente" />
            <mat-error *ngIf="form.get('nomeCliente')?.hasError('required')"
              >Nome do cliente é obrigatório</mat-error
            >
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="fill" class="full">
            <mat-label>CPF / CNPJ</mat-label>
            <input matInput formControlName="cpfCnpj" />
            <mat-error *ngIf="form.get('cpfCnpj')?.hasError('required')"
              >CPF/CNPJ é obrigatório</mat-error
            >
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="fill" class="full">
            <mat-label>Endereço</mat-label>
            <input matInput formControlName="endereco" />
            <mat-error *ngIf="form.get('endereco')?.hasError('required')"
              >Endereço é obrigatório</mat-error
            >
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="fill" class="full">
            <mat-label>Nome do responsável</mat-label>
            <input matInput formControlName="nomeResponsavel" />
            <mat-error *ngIf="form.get('nomeResponsavel')?.hasError('required')"
              >Nome do responsável é obrigatório</mat-error
            >
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="fill" class="full">
            <mat-label>Contato</mat-label>
            <input matInput formControlName="contato" />
            <mat-error *ngIf="form.get('contato')?.hasError('required')"
              >Contato é obrigatório</mat-error
            >
          </mat-form-field>
        </div>

        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
            Criar Cliente
          </button>
          <button
            mat-flat-button
            type="button"
            (click)="router.navigate(['/home'])"
          >
            Cancelar
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
