
<mat-dialog-content class="mat-typography">
      <!--Display das Experiências-->
    <article [style.display]="displayExperiencia" class="article-row"> 
             <header>
                 <h4 style="color: #3d009e">{{ title }}</h4>
                 <p>Início - {{ dataInicio }} /  Concluido - {{ dataFim }}</p>
                 <h5><b>{{ status }}</b></h5>
             </header>
             <div class="row">
                 <p>Cargo: <b>{{ cargo }}</b></p>
                 @for (lista of atividades; track $index) {
                     <ul>
                         <li>{{ lista }}</li>
                     </ul>
                 }
             </div>
             <section>
                 <div>
                     <p [innerHTML]="descricao"></p>
                 </div>
             </section>      
     </article> 
     <!--Display das Habilidades-->
     <article [style.display]="displayHabilidade" class="article-row-2"> 
         <header>
             <h4 style="color: #3d009e">{{ title }}</h4>
          </header>
         <section>
             <div>
                 <p [innerHTML]="descricao"></p>
             </div>
         </section>       
 </article>          
 </mat-dialog-content>
 <mat-dialog-actions align="center">
   <button [style.display]="buttonExp" class="buttonNone" routerLink="portfolio/experiencias" mat-button mat-dialog-close>Voltar</button>
 </mat-dialog-actions>
 <mat-dialog-actions align="center">
   <button [style.display]="buttonHabil" class="buttonNone1" routerLink="portfolio/conhecimentos" mat-button mat-dialog-close>Voltar</button>
 </mat-dialog-actions>
